# Credit model training (services/policy-ai/CLAUDE.md sections 8.4-8.5). Numbers live here, not in code.
data: data/training/synthetic_invoices.csv   # relative to the repo root; generated by training.synth if absent
model_dir: services/policy-ai/model          # relative to the repo root
split:                                       # time split by monthly cohort
  train: [1, 16]
  validation: [17, 20]
  test: [21, 24]
missing_tier: C            # a buyer with no tier or rating is scored with tier C's medians (as REVIEW.THIN_PROFILE prices it)
ece_bins: 10
targets: {auc_min: 0.75, ece_max: 0.03}
logistic_regression:
  C: 1.0                   # inverse L2 strength on standardised features
  max_iter: 5000
scorecard:                 # points = offset + factor x ln(good:bad odds)
  base_score: 600
  base_odds: 50
  pdo: 20
lightgbm:                  # brief 8.4: small, monotone trees
  params:
    objective: binary
    learning_rate: 0.03
    num_leaves: 15
    max_depth: 4
    min_data_in_leaf: 50
    lambda_l2: 1.0
    feature_fraction: 0.9
    monotone_constraints_method: advanced
    seed: 7
    deterministic: true
    num_threads: 1
    verbose: -1
  max_rounds: 2000
  early_stopping_rounds: 100
calibration:
  methods: [platt, isotonic]   # fitted on the validation split; the better validation Brier is kept
  min_pd: 0.000001             # floor for isotonic steps so no PD is exactly 0
