# Credit model training (services/policy-ai/CLAUDE.md sections 8.4-8.5). Numbers live here, not in code.
data: data/training/synthetic_invoices.csv   # relative to the repo root; generated by training.synth if absent
model_dir: services/policy-ai/model          # relative to the repo root
split:                                       # time split by monthly cohort
  train: [1, 16]
  validation: [17, 20]
  test: [21, 24]
missing_tier: C            # a buyer with no tier or rating is scored with tier C's medians (as REVIEW.THIN_PROFILE prices it)
ece_bins: 10
targets: {auc_min: 0.75, ece_max: 0.03}
logistic_regression:
  C: 1.0                   # inverse L2 strength on standardised features
  max_iter: 5000
scorecard:                 # points = offset + factor x ln(good:bad odds)
  base_score: 600
  base_odds: 50
  pdo: 20
